spring.config.import=optional:file:.env[.properties]
server.port=${PORT:5000}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
mqtt.url=${MQTT_URL:}
mqtt.user=${MQTT_USER:}
mqtt.password=${MQTT_PASSWORD:}

# SMS Configuration (Twilio / MSG91 / MOCK)
# NOTE: NO default alert phone number is configured here.
# SMS notifications are sent exclusively to each authenticated user's registered phone number from the database.
sms.provider=${SMS_PROVIDER:MOCK}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.from.number=${TWILIO_FROM_NUMBER:}

msg91.auth.key=${MSG91_AUTH_KEY:}
msg91.sender.id=${MSG91_SENDER_ID:}
msg91.template.id=${MSG91_TEMPLATE_ID:}

# ThingSpeak Integration
thingspeak.write.key=${THINGSPEAK_WRITE_KEY:A0B9TJ5N4L8R72ZE}
thingspeak.channel.id=${THINGSPEAK_CHANNEL_ID:3126283}
